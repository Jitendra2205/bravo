name: windows-installer
# Builds BravoSetup.exe on a Windows machine. Every push to main builds and tests it (download it from the
# run's "Artifacts"); pushing a tag like v0.1.0 also publishes it as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm bravo.spec
      - name: Self-test the packaged app
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process dist\Bravo\Bravo.exe -ArgumentList "--selftest", $out -Wait -PassThru
          if (Test-Path $out) { Get-Content $out } else { "no selftest output" }
          if ($p.ExitCode -ne 0) { exit 1 }
          "{0:N0} MB packaged" -f ((Get-ChildItem dist\Bravo -Recurse | Measure-Object Length -Sum).Sum / 1MB)
      - name: Build the installer
        run: |
          choco install innosetup -y --no-progress
          $env:BRAVO_VERSION = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0-dev" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "{0:N0} MB installer" -f ((Get-Item dist\BravoSetup.exe).Length / 1MB)
      - uses: actions/upload-artifact@v4
        with:
          name: BravoSetup
          path: desktop/dist/BravoSetup.exe
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/BravoSetup.exe
