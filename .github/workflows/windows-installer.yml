name: windows-installer
# Builds BravoSetup.exe on a Windows machine. Every push to main builds and tests it (download it from the
# run's "Artifacts"); pushing a tag like v0.1.0 also publishes it as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.1.0-beta.1); leave empty to only build"
        required: false
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm bravo.spec
      - name: Sign the app files (skipped until the signing secret is set)
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          # Windows Smart App Control and App Control policies block unsigned native code (.dll/.pyd/.exe).
          # Sign every PE file in the bundle with a publicly trusted certificate; self-signed certs do not help.
          if (-not $env:CODESIGN_PFX_BASE64) { "No signing secret set; the app files are unsigned."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1 -ExpandProperty FullName
          $files = Get-ChildItem dist\Bravo -Recurse -Include *.exe,*.dll,*.pyd
          & $signtool sign /f $pfx /p $env:CODESIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /v @($files.FullName)
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item $pfx
          "Signed $($files.Count) files."
      - name: Self-test the packaged app
        timeout-minutes: 5
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process dist\Bravo\Bravo.exe -ArgumentList "--selftest", $out -PassThru
          $done = $p.WaitForExit(180000)
          $report = @()
          if (Test-Path $out) { $report += Get-Content $out } else { $report += "no selftest output" }
          Get-ChildItem "$env:APPDATA\Bravo\logs" -ErrorAction SilentlyContinue | ForEach-Object { $report += "--- $($_.Name)"; $report += Get-Content $_.FullName }
          $report
          # Also as an annotation, readable through the API without downloading the log.
          $level = if ($done -and $p.ExitCode -eq 0) { "notice" } else { "error" }
          "::$level title=selftest::" + (($report | Select-Object -Last 40) -join "%0A")
          if (-not $done) { Stop-Process -Id $p.Id -Force; "selftest hung"; exit 1 }
          if ($p.ExitCode -ne 0) { exit 1 }
          "{0:N0} MB packaged" -f ((Get-ChildItem dist\Bravo -Recurse | Measure-Object Length -Sum).Sum / 1MB)
      - name: Build the installer
        run: |
          choco install innosetup -y --no-progress
          $tag = if ("${{ inputs.release_tag }}") { "${{ inputs.release_tag }}" } elseif ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "" }
          $env:BRAVO_VERSION = if ($tag) { $tag.TrimStart("v") } else { "0.0.0-dev" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "{0:N0} MB installer" -f ((Get-Item dist\BravoSetup.exe).Length / 1MB)
      - name: Sign the installer (skipped until the signing secret is set)
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:CODESIGN_PFX_BASE64) { exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /f $pfx /p $env:CODESIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /v dist\BravoSetup.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item $pfx
      - uses: actions/upload-artifact@v4
        with:
          name: BravoSetup
          path: desktop/dist/BravoSetup.exe
      - if: github.ref_type == 'tag' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: desktop/dist/BravoSetup.exe
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-') }}   # v0.1.0-beta.1 = test build; v0.1.0 = public
          body: |
            **Download `BravoSetup.exe` below**, run it, and click Next until it finishes. Bravo opens with a puppy icon in your Start menu.
            If Windows says "Windows protected your PC", click **More info**, then **Run anyway** (Bravo is open source and not code-signed yet).
            For fast answers, open Settings > Cloud model, choose Groq (free) and paste a free key from console.groq.com.
